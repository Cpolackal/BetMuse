[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic", "venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"app/db/models/__init__.py" = ["F401"]  # side-effect imports register models with Alembic
